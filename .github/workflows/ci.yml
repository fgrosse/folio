name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the Go version pinned in mise.toml.
      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"

      - name: Restore Go modules cache
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # The coverage profile is uploaded for every run, also on main, where it
      # is the baseline that the report on a pull request compares against.
      - name: Test
        run: mise run test -- -coverprofile=coverage.txt
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage.txt

  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: unit_tests
    permissions:
      contents: read
      actions: read        # to download the coverage of this run and of the baseline on main
      pull-requests: write # to comment on the pull request
    steps:
      - uses: fgrosse/go-coverage-report@c4bf7e78d1379325814b4dd42d80e526082e788b # v1.5.0

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the Go and golangci-lint versions pinned in mise.toml. Go is
      # required here as well because golangci-lint shells out to "go list" to
      # load the packages it analyses.
      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"

      - name: Restore Go modules cache
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Go mod tidy
        run: go mod tidy -diff

      - name: golangci-lint
        run: mise run lint
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
